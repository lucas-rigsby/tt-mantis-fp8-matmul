# Tiny Tapeout project information
project:
  title:        "MANTIS FP8 matrix multiplier"      # Project title
  author:       "Lucas Rigsby"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "2xK by Kx2 FP8 (E4M3/E5M2) matrix multiply with exact products and BF16 accumulation"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mantis"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "fp8_unpack.v"
    - "fp8_mul.v"
    - "bf16_add_s1.v"
    - "bf16_add_s2.v"
    - "mantis_stage.v"
    - "mantis_dp_shared.v"
    - "tt_um_mantis.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data[0] / fmt_a"
  ui[1]: "data[1] / fmt_b"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "data[6]"
  ui[7]: "data[7]"

  # Outputs
  uo[0]: "rdata[0]"
  uo[1]: "rdata[1]"
  uo[2]: "rdata[2]"
  uo[3]: "rdata[3]"
  uo[4]: "rdata[4]"
  uo[5]: "rdata[5]"
  uo[6]: "rdata[6]"
  uo[7]: "rdata[7]"

  # Bidirectional pins
  uio[0]: "in_valid"
  uio[1]: "cmd[0]"
  uio[2]: "cmd[1]"
  uio[3]: "tck (reserved)"
  uio[4]: "busy"
  uio[5]: "tms (reserved)"
  uio[6]: "tdi (reserved)"
  uio[7]: "tdo (reserved, 0)"

# Do not change!
yaml_version: 6
